name: ci
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Python
        run: uv python install 3.12
      - name: Lint
        run: uvx ruff@0.8.4 check .
      - name: Format
        run: uvx ruff@0.8.4 format --check .
      - name: Tests
        run: uv run --no-project --python 3.12 --with pytest==8.3.4 pytest -q
