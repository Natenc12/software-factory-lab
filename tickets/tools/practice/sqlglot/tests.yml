name: tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --quiet --upgrade pip
          .venv/bin/python -m pip install --quiet -e ".[dev]"
      - name: Run the tests
        run: PATH="$PWD/.venv/bin:$PATH" SKIP_INTEGRATION=1 python -m unittest
