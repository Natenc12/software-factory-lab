# Per-PR merge gate: lint, format, migrations (twice), and the whole test suite.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same PR/branch cancels the older, still-running job.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: ruff + pytest (lab)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    env:
      # Pin the interpreter for every uv command, and make every uv command use uv.lock as-is
      # (a stale lockfile is a red, not a silent re-lock).
      UV_PYTHON: "3.10"
      UV_LOCKED: "1"
    steps:
      # Pinned to commit SHAs, same as grounded-class-tutor's ci.yml: a tag can be republished.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      - name: Install Python 3.10
        run: uv python install 3.10

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Ruff
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      # Twice on purpose: the second pass proves the migrations and migrate.py are idempotent.
      - name: Apply migrations twice on a fresh database
        env:
          LAB_DB: ${{ runner.temp }}/ci-lab.db
        run: |
          uv run python scripts/migrate.py
          uv run python scripts/migrate.py

      - name: Tests
        run: uv run pytest -q
